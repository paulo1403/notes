name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to archserver
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /home/paulo/notes
            git pull origin main
            cd web && ~/.local/share/mise/installs/bun/1.3.14/bin/bun install && ~/.local/share/mise/installs/bun/1.3.14/bin/bun run build
            kill $(pgrep -f 'bun.*index.ts' | head -1) 2>/dev/null || true
            sleep 1
            cd /home/paulo/notes/api && ~/.local/share/mise/installs/bun/1.3.14/bin/bun run src/index.ts &>/tmp/api.log &
